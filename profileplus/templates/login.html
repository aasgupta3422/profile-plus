{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h1>Welcome Back</h1>
    <p>Login to continue to your dashboard.</p>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn primary full">Login</button>
    </form>
    <p class="center">New user? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
